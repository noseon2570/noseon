<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>고양이 vs 강아지 판별기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
</head>
<body class="bg-gray-100 flex flex-col items-center justify-center min-h-screen p-4">

    <h1 class="text-3xl font-bold mb-6 text-gray-800">동물 판별기 (고양이 vs 강아지)</h1>

    <div id="status-message" class="text-red-500 font-bold mb-4"></div>
    <div id="webcam-container" class="mb-4 rounded-xl overflow-hidden shadow-lg border-4 border-white bg-gray-300 w-[300px] h-[300px] flex items-center justify-center">
        <p class="text-gray-600">카메라를 시작하면 여기에 화면이 나옵니다.</p>
    </div>
    <div id="label-container" class="space-y-2 text-xl font-semibold text-gray-700"></div>

    <button onclick="init()" class="mt-6 bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-8 rounded-full shadow-lg transition-all transform hover:scale-105">
        카메라 시작하기
    </button>

    <script type="text/javascript">
        // 여기에 티처블 머신에서 발급받은 실제 링크를 넣으세요!
        // 예: const URL = "https://teachablemachine.withgoogle.com/models/abc12345/";
        const URL = "https://teachablemachine.withgoogle.com/train/image"; 
        let model, webcam, labelContainer, maxPredictions;

        async function init() {
            if (!URL || URL.includes("YOUR_MODEL_URL_HERE")) {
                document.getElementById("status-message").innerText = "오류: 모델 URL이 설정되지 않았습니다. 코드 상단의 URL 변수를 확인하세요.";
                return;
            }

            try {
                const modelURL = URL + "model.json";
                const metadataURL = URL + "metadata.json";

                model = await tmImage.load(modelURL, metadataURL);
                maxPredictions = model.getTotalClasses();

                const flip = true; 
                webcam = new tmImage.Webcam(300, 300, flip); 
                await webcam.setup(); 
                await webcam.play();
                window.requestAnimationFrame(loop);

                document.getElementById("webcam-container").innerHTML = "";
                document.getElementById("webcam-container").appendChild(webcam.canvas);
                labelContainer = document.getElementById("label-container");
                labelContainer.innerHTML = "";
                for (let i = 0; i < maxPredictions; i++) {
                    labelContainer.appendChild(document.createElement("div"));
                }
                document.getElementById("status-message").innerText = "";
            } catch (err) {
                document.getElementById("status-message").innerText = "모델을 불러오는 중 오류가 발생했습니다: " + err.message;
            }
        }

        async function loop() {
            webcam.update();
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            for (let i = 0; i < maxPredictions; i++) {
                const classPrediction =
                    prediction[i].className + ": " + prediction[i].probability.toFixed(2);
                labelContainer.childNodes[i].innerHTML = classPrediction;
            }
        }
    </script>
</body>
</html>
